name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # NOTE: the previous `uv python install` + `uv pip install --system`
      # combination targeted the runner's distro-managed interpreter instead
      # of the uv-managed one, so every Linux/macOS job died in this step with
      # PEP 668 "externally managed environment". Standard setup-python +
      # pip avoids that entirely (same proven pattern as AgentJanitor CI).
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Type Checker
        run: mypy src

      - name: Run Pytest Suite
        run: pytest -v --cov=timmytest --cov-report=xml

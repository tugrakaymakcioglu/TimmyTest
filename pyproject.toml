[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timmytest"
version = "2.0.0"
description = "Zero-token test runner & AST test-gap analyzer for AI coding agents (Claude Code, Codex, Cursor, Copilot, Antigravity). Runs tests locally with 0 AI tokens, detects missing test modules, isolates failure root causes, and generates dense handoff prompts. 35+ ecosystems, MCP server included."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Tugra Kaymakcioglu" },
    { name = "TimmyTest contributors" }
]
keywords = [
    "test-runner",
    "test-gap-analyzer",
    "ai-agent",
    "token-saver",
    "mcp",
    "model-context-protocol",
    "agent-integration",
    "claude-code",
    "codex",
    "cursor",
    "github-copilot",
    "antigravity",
    "prompt-engineering",
    "pytest",
    "vitest",
    "jest",
    "cargo-test",
    "go-test",
    "code-coverage",
    "test-gap-analysis",
    "ast-scanner",
    "developer-tools",
    "cli",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.5",
    "rich>=13.8.0",
    "pydantic>=2.9.0",
    "PyYAML>=6.0.2",
    "textual>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/tugrakaymakcioglu/TimmyTest"
Repository = "https://github.com/tugrakaymakcioglu/TimmyTest.git"
Issues = "https://github.com/tugrakaymakcioglu/TimmyTest/issues"
Changelog = "https://github.com/tugrakaymakcioglu/TimmyTest/blob/main/CHANGELOG.md"

[project.scripts]
timmytest = "timmytest.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]
# Only needed to regenerate the embedded pixel art via tools/build_art.py.
art = [
    "pillow>=10.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/timmytest"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
